<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>exile-js</title>
    <link rel="icon" type="image/png" href="/exile-js/data/graphics/icon.png" />
    <style>
      /* The game's own fonts, so panel text measures like the C++ build. */
      @font-face {
        font-family: 'BoEPlain';
        src: url('/exile-js/data/fonts/plain.ttf') format('truetype');
      }
      @font-face {
        font-family: 'BoEBold';
        src: url('/exile-js/data/fonts/bold.ttf') format('truetype');
        font-weight: bold;
      }
      @font-face {
        font-family: 'BoEDungeon';
        src: url('/exile-js/data/fonts/dungeon.ttf') format('truetype');
      }
      @font-face {
        font-family: 'BoEMaidenword';
        src: url('/exile-js/data/fonts/maidenword.ttf') format('truetype');
      }

      body {
        background: #1a1a1a;
        color: #ddd;
        font-family: system-ui, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px;
      }
      #status {
        margin: 0;
        font-size: 13px;
        color: #aaa;
        min-height: 1.2em;
      }
      /* Drawn at 605x430 and scaled up so the pixel art stays crisp. */
      #canvas-wrap {
        position: relative;
        width: 1210px;
        max-width: 100%;
      }
      canvas {
        image-rendering: pixelated;
        background: #000;
        display: block;
        width: 100%;
        height: auto;
      }
      #spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        margin: -50px 0 0 -20px;
        border: 4px solid rgba(221, 221, 221, 0.2);
        border-top-color: #ddd;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading-file {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, 20px);
        font-size: 11px;
        color: #888;
        white-space: nowrap;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #spinner.hidden, #loading-file.hidden, #progress-wrap.hidden {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #progress-wrap {
        width: 1210px;
        max-width: 100%;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        width: 0%;
        background: #6a8fc7;
        transition: width 0.15s ease-out;
      }
    </style>
    <script type="module" crossorigin src="/exile-js/assets/index-DO1P66_w.js"></script>
  </head>
  <body>
    <div id="canvas-wrap">
      <canvas id="canvas" width="605" height="430"></canvas>
      <div id="spinner" aria-hidden="true"></div>
      <p id="loading-file" aria-hidden="true"></p>
    </div>
    <div id="progress-wrap" aria-hidden="true">
      <div id="progress-bar"></div>
    </div>
    <p id="status">Loading…</p>
  </body>
</html>
