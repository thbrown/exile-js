<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>exile-js</title>
    <style>
      /* The game's own fonts, so panel text measures like the C++ build. */
      @font-face {
        font-family: 'BoEPlain';
        src: url('/exile-js/data/fonts/plain.ttf') format('truetype');
      }
      @font-face {
        font-family: 'BoEBold';
        src: url('/exile-js/data/fonts/bold.ttf') format('truetype');
        font-weight: bold;
      }
      @font-face {
        font-family: 'BoEDungeon';
        src: url('/exile-js/data/fonts/dungeon.ttf') format('truetype');
      }
      @font-face {
        font-family: 'BoEMaidenword';
        src: url('/exile-js/data/fonts/maidenword.ttf') format('truetype');
      }

      body {
        background: #1a1a1a;
        color: #ddd;
        font-family: system-ui, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 12px;
      }
      #status {
        margin: 0;
        font-size: 13px;
        color: #aaa;
        min-height: 1.2em;
      }
      /* Drawn at 605x430 and scaled up so the pixel art stays crisp. */
      canvas {
        image-rendering: pixelated;
        background: #000;
        width: 1210px;
        max-width: 100%;
        height: auto;
      }
    </style>
    <script type="module" crossorigin src="/exile-js/assets/index-Dmwt1lrk.js"></script>
  </head>
  <body>
    <canvas id="canvas" width="605" height="430"></canvas>
    <p id="status">Loading…</p>
  </body>
</html>
